# pgBackRest for RoleMatch: one repository on the PC, encrypted with a key kept outside it (/run/secrets/backup-key, read at each call by /usr/local/bin/pgbackrest-keyed).
# The Mac collects the whole encrypted repository every 5 minutes over the existing key-only connection (deploy/mac/collectDbRepo.sh), so nothing is opened on the Mac.
[global]
repo1-path=/var/lib/pgbackrest
repo1-cipher-type=aes-256-cbc
repo1-retention-full=2
repo1-retention-diff=7
start-fast=y
compress-type=zst
log-level-console=info
log-level-file=detail
archive-async=n

[rolematch]
pg1-path=/var/lib/postgresql/data/pgdata
pg1-port=5432
pg1-user=postgres

# A restored database fetches its change log through the keyed wrapper too; plain pgbackrest there has no key, and recovery could never finish
# (found by the first restore drill, 6 Nov 2026).
[global:restore]
recovery-option=restore_command=pgbackrest-keyed --stanza=rolematch archive-get %f "%p"
