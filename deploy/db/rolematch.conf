# RoleMatch's PostgreSQL settings. Starting values for the 16 GB PC (docs/database/10: about 2 GB for the database); measured and tuned in rehearsal, not guessed further.
data_directory = '/var/lib/postgresql/data/pgdata'
hba_file = '/var/lib/postgresql/data/pgdata/pg_hba.conf'
listen_addresses = '*'                 # inside the container only; the host publishes it on 127.0.0.1 alone (run-db.sh)
port = 5432
max_connections = 60                   # live's pools today: 9 + 3 + 2, plus tests, backups, migrations and the console
superuser_reserved_connections = 3
shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 8MB
maintenance_work_mem = 128MB
password_encryption = scram-sha-256
ssl = off                              # traffic never leaves this machine (loopback); revisit when a second machine connects (ADR-004 §8)

# Continuous backup: every finished WAL segment goes to pgBackRest at once, and a segment is closed at least every 60 s,
# so at most about a minute of changes waits on this disk (the Mac then collects the repository every 5 minutes).
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest-keyed --stanza=rolematch archive-push %p'
archive_timeout = 60
max_wal_senders = 3

# What the console's health page and the advisors read.
shared_preload_libraries = 'pg_stat_statements'
log_min_duration_statement = 1000      # any statement over a second is logged, without its values
log_line_prefix = '%m [%p] %u@%d '
log_connections = off
log_lock_waits = on
statement_timeout = 0                  # set per role below, never globally (migrations and backups need longer)
timezone = 'UTC'
